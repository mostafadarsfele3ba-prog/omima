<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دروس اللغة العربية - الأستاذة أميمة عبدالوهاب عبدالرحمن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --nahw:#1d4ed8; --nahw-d:#1e3a8a; --nahw-l:#dbeafe;
    --bal:#7e22ce;  --bal-d:#6b21a8;  --bal-l:#f3e8ff;
    --adab:#0f766e; --adab-d:#115e59; --adab-l:#ccfbf1;
    --ink:#1e293b; --muted:#64748b; --card:#ffffff; --bg:#f4f6fb; --line:#e2e8f0;
    --gold1:#fde047; --gold2:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);background-image:radial-gradient(#d5dcec 1.4px,transparent 1.4px);background-size:24px 24px;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,#0b1a46,#1e3a8a 45%,#6b21a8 80%,#0f766e);color:#fff;text-align:center;padding:34px 16px 92px;position:relative}
  header .kicker{font-weight:700;color:#e0e7ff;font-size:clamp(1rem,3.5vw,1.25rem);letter-spacing:.5px}
  header h1{font-weight:900;font-size:clamp(1.9rem,7vw,3.6rem);line-height:1.2;margin:6px 0 12px;background:linear-gradient(to right,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(2px 4px 6px rgba(0,0,0,.45))}
  header .grade{display:inline-block;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:30px;padding:6px 20px;font-weight:700;font-size:clamp(.9rem,2.8vw,1.1rem)}
  header svg.wave{position:absolute;bottom:-1px;left:0;width:100%;height:auto}
  main{width:100%;max-width:1100px;margin:-40px auto 30px;padding:0 16px;position:relative;z-index:2}
  .toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .toolbar button{border:none;cursor:pointer;background:#fff;color:var(--ink);font-weight:800;font-size:1rem;padding:11px 20px;border-radius:14px;box-shadow:0 6px 16px rgba(15,23,42,.08);display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line)}
  .toolbar button:hover{transform:translateY(-1px)}
  section{margin-bottom:26px}
  section h2{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:900;margin:0 4px 12px}
  section h2 .dot{width:14px;height:14px;border-radius:50%}
  section h2 .count{font-size:.9rem;font-weight:700;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .card{background:var(--card);border-radius:18px;padding:18px 16px 16px;box-shadow:0 8px 22px rgba(15,23,42,.07);border:1px solid var(--line);border-top:6px solid var(--c);display:flex;flex-direction:column;gap:12px}
  .card .num{width:38px;height:38px;border-radius:12px;background:var(--cl);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem}
  .card .top{display:flex;align-items:center;gap:12px}
  .card h3{font-size:1.2rem;font-weight:900;line-height:1.4}
  .card .meta{font-size:.9rem;color:var(--muted);font-weight:600}
  .actions{display:flex;gap:8px;margin-top:auto}
  .actions a,.actions button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 8px;font-weight:800;font-size:1rem;text-decoration:none;cursor:pointer;border:2px solid var(--c);white-space:nowrap}
  .actions a{background:var(--c);color:#fff}
  .actions a:hover{background:var(--cd);border-color:var(--cd)}
  .actions button{background:#fff;color:var(--c)}
  .actions button:hover{background:var(--cl)}
  .actions button.done{background:#10b981;border-color:#10b981;color:#fff}
  footer{margin-top:auto;background:#1e293b;color:#cbd5e1;text-align:center;padding:22px 16px;border-top:4px solid var(--gold2);font-weight:600}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:#0f172a;color:#fff;padding:12px 22px;border-radius:14px;font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.25);transition:transform .25s,opacity .25s;opacity:0;visibility:hidden;z-index:50;max-width:calc(100% - 32px);text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
  @media (max-width:420px){.actions a,.actions button{font-size:.95rem}}
</style>
</head>
<body>
<header>
  <div class="kicker">دروس اللغة العربية التفاعلية مع الأستاذة</div>
  <h1>أميمة عبدالوهاب عبدالرحمن</h1>
  <div class="grade">الصف الأول الثانوي - الفصل الدراسي الأول</div>
  <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none" style="height:70px"><path fill="#f4f6fb" d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,170.7C960,160,1056,192,1152,208C1248,224,1344,224,1392,224L1440,224L1440,320L0,320Z"></path></svg>
</header>

<main>
  <div class="toolbar">
    <button id="copy-all" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      نسخ روابط كل الدروس
    </button>
    <button id="copy-home" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      نسخ رابط الصفحة الرئيسية
    </button>
  </div>
  <div id="sections"></div>
</main>

<footer>جميع الحقوق محفوظة &copy; | الأستاذة / أميمة عبدالوهاب عبدالرحمن</footer>
<div class="toast" id="toast">تم نسخ الرابط</div>

<script>
  const SITE_BASE = "https://darsfele3ba4-debug.github.io/omima/";
  const LESSONS = [{"slug": "kad", "title": "درس كاد وأخواتها", "branch": "القواعد النحوية", "n": 100}, {"slug": "ism-fael", "title": "درس إعمال اسم الفاعل", "branch": "القواعد النحوية", "n": 100}, {"slug": "ism-mafool", "title": "درس إعمال اسم المفعول", "branch": "القواعد النحوية", "n": 100}, {"slug": "kan", "title": "درس كان وأخواتها", "branch": "القواعد النحوية", "n": 100}, {"slug": "mubalagha", "title": "درس إعمال صيغ المبالغة", "branch": "القواعد النحوية", "n": 100}, {"slug": "tashbih", "title": "درس التشبيه", "branch": "البلاغة", "n": 100}, {"slug": "istiara", "title": "درس الاستعارة", "branch": "البلاغة", "n": 100}, {"slug": "adab-islami", "title": "الأدب الإسلامي", "branch": "الأدب", "n": 100}, {"slug": "adab-umawi", "title": "الأدب الأموي", "branch": "الأدب", "n": 100}];
  const BRANCHES = [
    {name: "القواعد النحوية", c: "var(--nahw)", cd: "var(--nahw-d)", cl: "var(--nahw-l)"},
    {name: "البلاغة", c: "var(--bal)", cd: "var(--bal-d)", cl: "var(--bal-l)"},
    {name: "الأدب", c: "var(--adab)", cd: "var(--adab-d)", cl: "var(--adab-l)"}
  ];

  function baseUrl(){
    if (location.protocol === "http:" || location.protocol === "https:") {
      return new URL("./", location.href).href;
    }
    return SITE_BASE;
  }
  function lessonUrl(l){ return baseUrl() + l.slug + ".html"; }

  let toastTimer = null;
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function fallbackCopy(text){
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta); return ok;
  }
  async function copyText(text){
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) {}
    return fallbackCopy(text);
  }

  function render(){
    const wrap = document.getElementById("sections");
    let n = 0;
    BRANCHES.forEach(br => {
      const items = LESSONS.filter(l => l.branch === br.name);
      if (!items.length) return;
      const sec = document.createElement("section");
      sec.innerHTML = `<h2><span class="dot" style="background:${br.c}"></span>${br.name} <span class="count">(${items.length === 2 ? "درسان" : items.length + " دروس"})</span></h2><div class="grid"></div>`;
      const grid = sec.querySelector(".grid");
      items.forEach(l => {
        n++;
        const card = document.createElement("div");
        card.className = "card";
        card.style.setProperty("--c", br.c); card.style.setProperty("--cd", br.cd); card.style.setProperty("--cl", br.cl);
        card.innerHTML = `
          <div class="top"><div class="num">${n}</div><div><h3>${l.title}</h3><div class="meta">${l.n} سؤال في 5 ألعاب</div></div></div>
          <div class="actions">
            <a href="./${l.slug}.html">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
              افتح الدرس</a>
            <button type="button" data-slug="${l.slug}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>انسخ الرابط</span></button>
          </div>`;
        const btn = card.querySelector("button");
        btn.addEventListener("click", async () => {
          const ok = await copyText(lessonUrl(l));
          if (ok) {
            btn.classList.add("done"); btn.querySelector("span").textContent = "تم النسخ";
            toast("تم نسخ رابط: " + l.title);
            setTimeout(() => { btn.classList.remove("done"); btn.querySelector("span").textContent = "انسخ الرابط"; }, 1800);
          } else {
            prompt("انسخ الرابط من هنا:", lessonUrl(l));
          }
        });
        grid.appendChild(card);
      });
      wrap.appendChild(sec);
    });
  }

  document.getElementById("copy-all").addEventListener("click", async () => {
    const lines = ["دروس اللغة العربية - الأستاذة أميمة عبدالوهاب عبدالرحمن", "الصف الأول الثانوي - الفصل الدراسي الأول", ""];
    LESSONS.forEach((l, i) => lines.push(`${i + 1}- ${l.title}:\n${lessonUrl(l)}`));
    const ok = await copyText(lines.join("\n"));
    ok ? toast("تم نسخ روابط كل الدروس") : prompt("انسخ الروابط من هنا:", lines.join(" | "));
  });
  document.getElementById("copy-home").addEventListener("click", async () => {
    const url = baseUrl();
    const ok = await copyText(url);
    ok ? toast("تم نسخ رابط الصفحة الرئيسية") : prompt("انسخ الرابط من هنا:", url);
  });

  render();
</script>
</body>
</html>
